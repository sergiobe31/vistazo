<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- Vistazo — adaptive icon
       Canvas 108x108dp. Zona segura: círculo c(54,54) r=33 (66dp de diámetro).
       Paleta: fondo #FAF3D9 (papel viejo), tinta #1F2937, acento #B45309.
       Plano, sin sombras ni gradientes, sin texto. Trazos >= 5.5dp.

       Concepto: ojo entrecerrado (vistazo = mirada breve) cuya pupila es un
       cursor de terminal ámbar, descentrada hacia la derecha (la mirada va
       rápida a otro lado). Debajo, un prompt de terminal (_) en ámbar:
       el ojo está "en la terminal". -->
  <defs>
    <clipPath id="lens">
      <path d="M26 50 Q54 33 82 50 Q54 71 26 50 Z"/>
    </clipPath>
  </defs>

  <!-- Capa de fondo -->
  <rect width="108" height="108" fill="#FAF3D9"/>

  <!-- Pupila: cursor de terminal, descentrada (glance) -->
  <rect x="51" y="38" width="12" height="26" fill="#B45309" clip-path="url(#lens)"/>

  <!-- Ojo entrecerrado (párpado superior e inferior) -->
  <path d="M26 50 Q54 33 82 50" fill="none" stroke="#1F2937" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M26 50 Q54 71 82 50" fill="none" stroke="#1F2937" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Prompt de terminal bajo el ojo -->
  <rect x="46" y="69.25" width="16" height="5.5" rx="1" fill="#B45309"/>

  <!-- Zona segura de referencia (no renderizar en producción):
       <circle cx="54" cy="54" r="33" fill="none" stroke="#B45309" stroke-width="0.5" stroke-dasharray="2 2"/> -->
</svg>